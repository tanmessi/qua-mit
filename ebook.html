<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f1e8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Tải ebook — Quả Mít</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="ebook.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="wordmark" href="/" aria-label="Về trang chủ"><img src="Logo-qua-mit.png" alt="Quả Mít" /></a>
      <a class="header-cta" href="/#ebooks">Xem ebook khác <span aria-hidden="true">↗</span></a>
    </header>
    <main class="page-width section-space ebook-access">
      <p class="eyebrow">EBOOK · TRANG TẢI RIÊNG CỦA BẠN</p>
      <h1 id="ebook-title">Đang kiểm tra đơn hàng…</h1>
      <dl class="checkout-summary" id="ebook-summary" hidden>
        <div><dt>Mã đơn</dt><dd id="ebook-order"></dd></div>
        <div><dt>Số tiền</dt><dd id="ebook-amount"></dd></div>
        <div><dt>Nội dung chuyển khoản</dt><dd id="ebook-transfer"></dd></div>
        <div><dt>Trạng thái</dt><dd id="ebook-status"></dd></div>
      </dl>
      <p class="ebook-message" id="ebook-message" aria-live="polite"></p>
      <a class="button button-coral" id="ebook-download" href="#" hidden>Tải ebook PDF <span aria-hidden="true">↓</span></a>
      <p class="checkout-email-note">Đừng chia sẻ link này. Mỗi đơn có giới hạn số lượt tải. Cần hỗ trợ? Email <a href="mailto:tanpl.cto@gmail.com">tanpl.cto@gmail.com</a> kèm mã đơn.</p>
    </main>
  </body>
</html>
